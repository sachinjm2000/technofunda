<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketSmith Dashboard</title>
<script>
(function(){
  const KEY = 'ms_auth';
  const PASS = 'msresearch2025';
  if(sessionStorage.getItem(KEY) === '1') return;
  document.addEventListener('DOMContentLoaded', function(){
    var overlay = document.getElementById('auth-overlay');
    overlay.style.display = 'flex';
    document.getElementById('auth-input').focus();
    document.getElementById('auth-btn').onclick = tryLogin;
    document.getElementById('auth-input').onkeydown = function(e){ if(e.key==='Enter') tryLogin(); };
    function tryLogin(){
      var val = document.getElementById('auth-input').value;
      if(val === PASS){
        sessionStorage.setItem(KEY, '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('auth-err').style.display = 'block';
        document.getElementById('auth-input').value = '';
        document.getElementById('auth-input').focus();
      }
    }
  });
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surface:#161B22;--border:#21262D;--border2:#30363D;
  --fg:#E6EDF3;--dim:#8B949E;--dim2:#484F58;
  --blue:#58A6FF;--green:#3FB950;--purple:#A371F7;
  --yellow:#D29922;--red:#F85149;
}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:14px;line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--border);
         padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.header h1{font-size:18px;font-weight:700;color:var(--fg)}
.header .sub{font-size:12px;color:var(--dim)}
.badge-count{background:#21262D;border:1px solid var(--border2);border-radius:20px;
              padding:2px 10px;font-size:11px;color:var(--dim);margin-left:auto}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:168px;background:var(--surface);border-right:1px solid var(--border);
          overflow-y:auto;flex-shrink:0;padding:12px 8px}
.sidebar-title{font-size:10px;color:var(--dim2);text-transform:uppercase;
                letter-spacing:.6px;padding:4px 8px 8px}
.date-btn{width:100%;text-align:left;background:none;border:none;
           padding:7px 10px;border-radius:6px;font-size:12px;font-family:inherit;
           color:var(--dim);cursor:pointer;transition:all .15s;white-space:nowrap}
.date-btn:hover{background:#21262D;color:var(--fg)}
.date-btn.active{background:#1F6FEB22;color:var(--blue);font-weight:600;
                  border-left:2px solid var(--blue);padding-left:8px}
.date-btn .dot-row{display:flex;gap:3px;margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.dot.on{background:var(--green)}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px}
.date-label{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:6px}
.date-sub{font-size:12px;color:var(--dim);margin-bottom:20px}

/* Cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.card{background:var(--surface);border:1px solid var(--border2);border-radius:10px;
       padding:20px;text-decoration:none;color:inherit;display:block;
       transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent,#58A6FF);transform:translateY(-2px);
             box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card-accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,#58A6FF)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card-emoji{font-size:28px;line-height:1}
.card-title{font-size:16px;font-weight:700;color:var(--fg)}
.card-sub{font-size:11px;color:var(--dim);margin-top:2px}
.card-desc{font-size:12px;color:#B1BAC4;line-height:1.5;margin-bottom:14px}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.open-btn{font-size:12px;font-weight:600;color:var(--accent,#58A6FF);
           display:flex;align-items:center;gap:4px}
.open-btn::after{content:'↗';font-size:14px}

/* Missing card */
.card.missing{opacity:.4;pointer-events:none;border-style:dashed}
.card.missing .card-title{color:var(--dim)}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty h2{font-size:18px;margin-bottom:8px;color:var(--fg)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Light mode — mirrors the override in ms_screens_watchlist.py so the
   dashboard follows the OS theme like every page it links to.
   The three rules below use hardcoded dark values a :root override
   cannot reach, so they are restated here. */
@media(prefers-color-scheme:light){
  :root{--bg:#f6f8fa;--surface:#fff;--border:#e1e4e8;--border2:#d0d7de;
        --fg:#24292f;--dim:#57606a;--dim2:#6e7781}
  .badge-count{background:#eaeef2}
  .date-btn:hover{background:#eaeef2}
  .card-desc{color:#57606a}
}
</style>
</head>
<body>

<div id="auth-overlay" style="display:none;position:fixed;inset:0;background:rgba(13,17,23,.97);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="background:#161B22;border:1px solid #30363D;border-radius:12px;padding:40px 48px;text-align:center;min-width:320px">
    <div style="font-size:32px;margin-bottom:12px">📊</div>
    <div style="font-size:18px;font-weight:700;color:#E6EDF3;margin-bottom:4px">MarketSmith Dashboard</div>
    <div style="font-size:12px;color:#8B949E;margin-bottom:24px">Enter password to continue</div>
    <input id="auth-input" type="password" placeholder="Password"
      style="width:100%;padding:10px 14px;background:#0D1117;border:1px solid #30363D;border-radius:6px;
             color:#E6EDF3;font-size:14px;outline:none;margin-bottom:10px;box-sizing:border-box">
    <div id="auth-err" style="display:none;color:#F85149;font-size:12px;margin-bottom:10px">Incorrect password</div>
    <button id="auth-btn"
      style="width:100%;padding:10px;background:#1F6FEB;border:none;border-radius:6px;
             color:#fff;font-size:14px;font-weight:600;cursor:pointer">Unlock</button>
  </div>
</div>

<div class="header">
  <div>
    <h1>📊 MarketSmith Dashboard</h1>
    <div class="sub">Daily research HTMLs · click any card to open</div>
  </div>
  <div class="badge-count" id="totalDates"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Dates</div>
    <div id="dateList"></div>
  </div>
  <div class="main" id="main">
    <div class="empty"><h2>No files found</h2><p>Run any daily script to generate HTMLs in ~/Downloads</p></div>
  </div>
</div>

<script>
const DATA = [{"date": "2026-08-08", "files": [{"suffix": "GSI_FormingBase_AI_Radar", "path": "2026-08-08_GSI_FormingBase_AI_Radar.html", "emoji": "\ud83e\udde0", "title": "GSI Radar", "desc": "AZAD-style pre-breakout scanner \u00b7 Forming Base + Buy Zone", "color": "#F78166"}, {"suffix": "MS_Screens_Watchlist", "path": "2026-08-08_MS_Screens_Watchlist.html", "emoji": "\ud83d\udccb", "title": "MS Screens", "desc": "MarketSmith curated screens \u00d7 GSI \u00b7 confluence-scored watchlist", "color": "#A371F7"}, {"suffix": "MultiScreen_Overlap", "path": "2026-08-08_MultiScreen_Overlap.html", "emoji": "\ud83d\udd00", "title": "Multi-Screen", "desc": "Stocks in 2+ screeners \u00b7 fast consensus signal", "color": "#FFD600"}, {"suffix": "RS_Momentum_Radar", "path": "2026-08-08_RS_Momentum_Radar.html", "emoji": "\ud83d\udcc8", "title": "RS Momentum", "desc": "Biggest RS improvement 1W/2W/3W \u00b7 institutional buying signal", "color": "#3FB950"}]}, {"date": "2026-08-07", "files": [{"suffix": "GSI_FormingBase_AI_Radar", "path": "2026-08-07_GSI_FormingBase_AI_Radar.html", "emoji": "\ud83e\udde0", "title": "GSI Radar", "desc": "AZAD-style pre-breakout scanner \u00b7 Forming Base + Buy Zone", "color": "#F78166"}]}, {"date": "2026-08-06", "files": [{"suffix": "GSI_FormingBase_AI_Radar", "path": "2026-08-06_GSI_FormingBase_AI_Radar.html", "emoji": "\ud83e\udde0", "title": "GSI Radar", "desc": "AZAD-style pre-breakout scanner \u00b7 Forming Base + Buy Zone", "color": "#F78166"}, {"suffix": "RS_Momentum_Radar", "path": "2026-08-06_RS_Momentum_Radar.html", "emoji": "\ud83d\udcc8", "title": "RS Momentum", "desc": "Biggest RS improvement 1W/2W/3W \u00b7 institutional buying signal", "color": "#3FB950"}]}, {"date": "2026-08-05", "files": [{"suffix": "GSI_FormingBase_AI_Radar", "path": "2026-08-05_GSI_FormingBase_AI_Radar.html", "emoji": "\ud83e\udde0", "title": "GSI Radar", "desc": "AZAD-style pre-breakout scanner \u00b7 Forming Base + Buy Zone", "color": "#F78166"}]}];
const DEFAULT = '2026-08-08';

const ORDER = ["GSI_FormingBase_AI_Radar", "MS_Screens_Watchlist", "MultiScreen_Overlap", "RS_Momentum_Radar"];
const META = {"GSI_FormingBase_AI_Radar": ["\ud83e\udde0", "GSI Radar", "AZAD-style pre-breakout scanner \u00b7 Forming Base + Buy Zone", "#F78166"], "MS_Screens_Watchlist": ["\ud83d\udccb", "MS Screens", "MarketSmith curated screens \u00d7 GSI \u00b7 confluence-scored watchlist", "#A371F7"], "MultiScreen_Overlap": ["\ud83d\udd00", "Multi-Screen", "Stocks in 2+ screeners \u00b7 fast consensus signal", "#FFD600"], "RS_Momentum_Radar": ["\ud83d\udcc8", "RS Momentum", "Biggest RS improvement 1W/2W/3W \u00b7 institutional buying signal", "#3FB950"]};

function buildSidebar() {
  const list = document.getElementById('dateList');
  const total = document.getElementById('totalDates');
  total.textContent = DATA.length + ' date' + (DATA.length !== 1 ? 's' : '');
  DATA.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (d.date === DEFAULT ? ' active' : '');
    btn.dataset.date = d.date;
    // dot indicators for which files exist
    const dots = ORDER.map(s => `<div class="dot ${d.files.find(f=>f.suffix===s)?'on':''}"></div>`).join('');
    btn.innerHTML = `<div>${d.date}</div><div class="dot-row">${dots}</div>`;
    btn.onclick = () => selectDate(d.date, btn);
    list.appendChild(btn);
  });
}

function selectDate(dateStr, btn) {
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMain(dateStr);
}

function renderMain(dateStr) {
  const entry = DATA.find(d => d.date === dateStr);
  const main = document.getElementById('main');
  if (!entry) { main.innerHTML = '<div class="empty"><h2>No data</h2></div>'; return; }

  const fileMap = {};
  entry.files.forEach(f => fileMap[f.suffix] = f);

  const isToday = dateStr === new Date().toISOString().slice(0,10);
  const cards = ORDER.map(suffix => {
    const f = fileMap[suffix];
    const [emoji, title, desc, color] = META[suffix];
    if (!f) {
      return `<div class="card missing" style="--accent:${color}">
        <div class="card-accent"></div>
        <div class="card-header">
          <div class="card-emoji">${emoji}</div>
          <div><div class="card-title">${title}</div><div class="card-sub">Not generated</div></div>
        </div>
        <div class="card-desc">${desc}</div>
      </div>`;
    }
    return `<a class="card" href="${f.path}" target="_blank" style="--accent:${color}">
      <div class="card-accent"></div>
      <div class="card-header">
        <div class="card-emoji">${emoji}</div>
        <div>
          <div class="card-title">${title}</div>
          <div class="card-sub">${dateStr}${isToday ? ' · Today' : ''}</div>
        </div>
      </div>
      <div class="card-desc">${desc}</div>
      <div class="card-footer">
        <span class="open-btn">Open in browser</span>
      </div>
    </a>`;
  }).join('');

  const count = entry.files.length;
  main.innerHTML = `
    <div class="date-label">${dateStr}${isToday ? ' <span style="font-size:13px;color:var(--green);font-weight:500">· Today</span>' : ''}</div>
    <div class="date-sub">${count} of 4 files available</div>
    <div class="grid">${cards}</div>
  `;
}

buildSidebar();
renderMain(DEFAULT);
</script>
</body>
</html>
